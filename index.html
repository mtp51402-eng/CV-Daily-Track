<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>മദ്രസ ദൈനംദിന ട്രാക്കർ</title>
  <meta name="description" content="മദ്രസ വിദ്യാർത്ഥികളുടെ ദൈനംദിന ആരാധനാ രേഖ" />
  <meta name="theme-color" content="#047857" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="മദ്രസ ട്രാക്കർ" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Malayalam:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <h1>മദ്രസ ദൈനംദിന ട്രാക്കർ</h1>
  </header>

  <div class="strip" id="strip">
    <div class="sync" aria-live="polite">
      <span class="dot" id="syncDot"></span>
      <span id="syncText">…</span>
    </div>
    <div class="strip-actions">
      <button type="button" id="btnBell" class="chip" data-act="reminder" aria-label="9:00 PM ഓർമ്മപ്പെടുത്തൽ"></button>
      <button type="button" id="btnInstall" class="chip chip-dark" data-act="install">ആപ്പ് ഇൻസ്റ്റാൾ</button>
    </div>
  </div>

  <main id="app" class="app"></main>

  <nav id="bottomNav" class="bottom-nav" hidden></nav>

  <div id="modalRoot"></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <noscript><p style="padding:24px">ഈ ആപ്പ് പ്രവർത്തിക്കാൻ JavaScript ആവശ്യമാണ്.</p></noscript>
  <script src="app.js"></script>
</body>
</html>
